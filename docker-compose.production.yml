version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: clone-prod-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      API_URL: http://backend:4000
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: clone-prod-backend
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://clone_admin:${POSTGRES_PASSWORD}@postgres:5432/clone_os?schema=public
      REDIS_URL: redis://redis:6379
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    container_name: clone-prod-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://clone_admin:${POSTGRES_PASSWORD}@postgres:5432/clone_os?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: ankane/pgvector:v0.5.1
    container_name: clone-prod-postgres
    environment:
      POSTGRES_DB: clone_os
      POSTGRES_USER: clone_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_prod_password}
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clone_admin -d clone_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clone-prod-redis
    volumes:
      - prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  prod_postgres_data:
  prod_redis_data:
